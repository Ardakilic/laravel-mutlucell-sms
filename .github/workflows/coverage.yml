name: Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml'
      - '.github/workflows/coverage.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage:
    name: Report coverage (base vs head)
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: head

      - name: Check out base branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: simplexml
          coverage: pcov
          tools: composer

      - name: Measure coverage on base and head
        id: measure
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -u
          cover() {
            # $1 = source dir. Runs the suite; leaves coverage/clover.xml behind when supported.
            # Returns phpunit's exit code (0 when skipped).
            if [ ! -f "$1/phpunit.xml" ] || [ ! -d "$1/tests" ]; then
              return 0
            fi
            (cd "$1" && composer install -q --no-interaction --prefer-dist --no-progress && vendor/bin/phpunit --coverage-clover=coverage/clover.xml --coverage-text --only-summary-for-coverage-text)
          }
          pct() {
            # $1 = clover file. Prints "lines methods classes" ("n/a" each when missing).
            # Classes are counted covered only when all their methods are covered, like PHPUnit does.
            php -r '$f = $argv[1]; if (!is_file($f)) { echo "n/a n/a n/a"; } else { $x = simplexml_load_file($f); $m = $x->project->metrics; $l = (int) $m["statements"] ? sprintf("%.1f", 100 * (int) $m["coveredstatements"] / (int) $m["statements"]) : "n/a"; $e = (int) $m["methods"] ? sprintf("%.1f", 100 * (int) $m["coveredmethods"] / (int) $m["methods"]) : "n/a"; $t = $c = 0; foreach ($x->xpath("//class") as $cl) { $cm = $cl->metrics; $t++; if ((int) $cm["coveredmethods"] === (int) $cm["methods"]) { $c++; } } echo "$l $e " . ($t ? sprintf("%.1f", 100 * $c / $t) : "n/a"); }' "$1"
          }
          delta() {
            # $1 = base, $2 = head. Prints "+N.N" or "n/a".
            if [ "$1" = "n/a" ] || [ "$2" = "n/a" ]; then echo "n/a"; else php -r 'printf("%+.1f", $argv[2] - $argv[1]);' "$1" "$2"; fi
          }
          HEAD_STATUS=0
          cover "$GITHUB_WORKSPACE/base" || true
          cover "$GITHUB_WORKSPACE/head" || HEAD_STATUS=$?
          read -r BL BM BC <<< "$(pct "$GITHUB_WORKSPACE/base/coverage/clover.xml")"
          read -r HL HM HC <<< "$(pct "$GITHUB_WORKSPACE/head/coverage/clover.xml")"
          DL=$(delta "$BL" "$HL"); DM=$(delta "$BM" "$HM"); DC=$(delta "$BC" "$HC")
          {
            echo "## Coverage: base vs head"
            echo ""
            echo "| Metric | base (\`${BASE_REF}\`) | head (\`${HEAD_REF}\`) | delta |"
            echo "| --- | --- | --- | --- |"
            echo "| Lines | ${BL}% | ${HL}% | ${DL} |"
            echo "| Methods | ${BM}% | ${HM}% | ${DM} |"
            echo "| Classes | ${BC}% | ${HC}% | ${DC} |"
          } >> "$GITHUB_STEP_SUMMARY"
          printf "%s\n" "| Lines | ${BL}% | ${HL}% | ${DL} |" "| Methods | ${BM}% | ${HM}% | ${DM} |" "| Classes | ${BC}% | ${HC}% | ${DC} |"
          for v in "lines_base=$BL" "lines_head=$HL" "lines_delta=$DL" "methods_base=$BM" "methods_head=$HM" "methods_delta=$DM" "classes_base=$BC" "classes_head=$HC" "classes_delta=$DC" "head_status=$HEAD_STATUS"; do
            echo "$v" >> "$GITHUB_OUTPUT"
          done

      - name: Comment coverage on PR
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          LINES_BASE: ${{ steps.measure.outputs.lines_base }}
          LINES_HEAD: ${{ steps.measure.outputs.lines_head }}
          LINES_DELTA: ${{ steps.measure.outputs.lines_delta }}
          METHODS_BASE: ${{ steps.measure.outputs.methods_base }}
          METHODS_HEAD: ${{ steps.measure.outputs.methods_head }}
          METHODS_DELTA: ${{ steps.measure.outputs.methods_delta }}
          CLASSES_BASE: ${{ steps.measure.outputs.classes_base }}
          CLASSES_HEAD: ${{ steps.measure.outputs.classes_head }}
          CLASSES_DELTA: ${{ steps.measure.outputs.classes_delta }}
        with:
          script: |
            const { BASE_REF, HEAD_REF } = process.env;
            const row = (label, b, h, d) => '| ' + label + ' | ' + b + '% | ' + h + '% | ' + d + ' |';
            const body = [
              '## Coverage: base vs head',
              '',
              '| Metric | base (`' + BASE_REF + '`) | head (`' + HEAD_REF + '`) | delta |',
              '| --- | --- | --- | --- |',
              row('Lines', process.env.LINES_BASE, process.env.LINES_HEAD, process.env.LINES_DELTA),
              row('Methods', process.env.METHODS_BASE, process.env.METHODS_HEAD, process.env.METHODS_DELTA),
              row('Classes', process.env.CLASSES_BASE, process.env.CLASSES_HEAD, process.env.CLASSES_DELTA),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if head tests failed
        env:
          HEAD_STATUS: ${{ steps.measure.outputs.head_status }}
        run: exit "${HEAD_STATUS:-1}"
