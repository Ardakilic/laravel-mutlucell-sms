name: Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage:
    name: Report coverage (base vs head)
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check out base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml
          coverage: pcov
          tools: composer

      - name: Measure coverage on base and head
        id: measure
        run: |
          set -u
          cover() {
            # $1 = source dir, $2 = file to write "NN.N" or "n/a" into.
            # Prints the phpunit log; returns phpunit's exit code (0 when skipped).
            if [ ! -f "$1/phpunit.xml" ] || [ ! -d "$1/tests" ]; then
              echo "n/a" > "$2"
              return 0
            fi
            (cd "$1" && composer install -q --no-interaction --prefer-dist --no-progress && vendor/bin/phpunit --coverage-clover=coverage/clover.xml --coverage-text --only-summary-for-coverage-text)
            status=$?
            if [ -f "$1/coverage/clover.xml" ]; then
              php -r '$x = simplexml_load_file($argv[1]); $m = $x->project->metrics; printf("%.1f", 100 * (int) $m["coveredstatements"] / (int) $m["statements"]);' "$1/coverage/clover.xml" > "$2"
            else
              echo "n/a" > "$2"
            fi
            return $status
          }
          BASE_STATUS=0
          HEAD_STATUS=0
          cover "$GITHUB_WORKSPACE/base" /tmp/cov-base.txt || BASE_STATUS=$?
          cover "$GITHUB_WORKSPACE/head" /tmp/cov-head.txt || HEAD_STATUS=$?
          BASE_COV=$(cat /tmp/cov-base.txt)
          HEAD_COV=$(cat /tmp/cov-head.txt)
          if [ "$BASE_COV" = "n/a" ] || [ "$HEAD_COV" = "n/a" ]; then
            DELTA="n/a"
          else
            DELTA=$(php -r 'printf("%+.1f", $argv[2] - $argv[1]);' "$BASE_COV" "$HEAD_COV")
          fi
          {
            echo "## Coverage: base vs head"
            echo ""
            echo "| Ref | Line coverage |"
            echo "| --- | --- |"
            echo "| base (\`${{ github.base_ref }}\`) | ${BASE_COV}% |"
            echo "| head (\`${{ github.head_ref }}\`) | ${HEAD_COV}% |"
            echo "| delta | ${DELTA} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "base=${BASE_COV}% head=${HEAD_COV}% delta=${DELTA}"
          echo "base_cov=${BASE_COV}" >> "$GITHUB_OUTPUT"
          echo "head_cov=${HEAD_COV}" >> "$GITHUB_OUTPUT"
          echo "delta=${DELTA}" >> "$GITHUB_OUTPUT"
          echo "head_status=${HEAD_STATUS}" >> "$GITHUB_OUTPUT"

      - name: Comment coverage on PR
        if: always()
        uses: actions/github-script@v8
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_COV: ${{ steps.measure.outputs.base_cov }}
          HEAD_COV: ${{ steps.measure.outputs.head_cov }}
          DELTA: ${{ steps.measure.outputs.delta }}
        with:
          script: |
            const marker = '<!-- mutlucell-coverage-report -->';
            const { BASE_REF, HEAD_REF, BASE_COV, HEAD_COV, DELTA } = process.env;
            const body = [
              marker,
              '## Coverage: base vs head',
              '',
              '| Ref | Line coverage |',
              '| --- | --- |',
              '| base (`' + BASE_REF + '`) | ' + BASE_COV + '% |',
              '| head (`' + HEAD_REF + '`) | ' + HEAD_COV + '% |',
              '| delta | ' + DELTA + ' |',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if head tests failed
        run: exit ${{ steps.measure.outputs.head_status }}
